name: Step 1 缺貨自動通知系統

on:
  workflow_dispatch: # 讓你可以手動點按鈕執行

jobs:
  run_step1:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 取得程式碼
        uses: actions/checkout@v3

      - name: 2. 安裝 Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. 安裝必要套件
        run: |
          pip install pandas selenium webdriver-manager gspread oauth2client requests

      - name: 4. 動態生成 Google 金鑰檔案
        run: echo '${{ secrets.GCP_JSON }}' > gcp-key.json

      - name: 5. 執行自動化腳本
        env:
          USALE_USER: ${{ secrets.USALE_USER }}
          USALE_PW: ${{ secrets.USALE_PW }}
          ONESHOP_USER: ${{ secrets.ONESHOP_USER }}
          ONESHOP_PW: ${{ secrets.ONESHOP_PW }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: python Step1_Notice.py
