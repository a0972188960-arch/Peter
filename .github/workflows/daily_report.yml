name: Meta Daily Report

on:
  schedule:
    # 每 5 分鐘執行一次 (GitHub Actions 的極限頻率)
    # 用來測試雲端是否會「自動」排隊執行
    - cron: '*/5 * * * *'
  workflow_dispatch: # 讓你可以手動點擊測試按鈕

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install facebook_business requests

      - name: Run script
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: python final_report.py
