name: Meta Daily Report

on:
  schedule:
    # 每天台灣時間 04:00 執行 (UTC 20:00)
    # 分 時 日 月 週
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install facebook_business requests

      - name: Run script
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: python final_report.py
